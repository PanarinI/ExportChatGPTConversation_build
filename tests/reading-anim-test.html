<!doctype html>
<meta charset="utf-8">
<title>Человечек карточки — стенд</title>
<!--
  Проверяет сцену anim.js в настоящей карточке (templates.js + capture.js). Два состояния — слово автора 17.11
  после живой выгрузки: «2 состояния наверх и вниз»; позы, что менялись сами (ждёт, картинки), «скорее больше
  раздражало».
    наверх (подъём) — крутит ручку, лента едет вниз, листы не летят;
    вниз (чтение) — ручка стоит, на каждое новое число лента делает шаг, листок летит в стопку;
    сколько бы ни стояло число (картинки грузятся) — он пишет дальше, поза не меняется;
    «Paused» (вкладка скрыта) — сцена замирает на месте; число пошло — живёт дальше;
    после прокрутки (подготовка, картинки, сервер) — идёт к стопке и скрепляет её в книгу «PDF», без мигания
    между шагами (1.2.7); конец экспорта — сцены нет; короткий чат не мелькает (сцена с 1,2 с).
  Время сцены — вручную (_manual/_tick): в headless кадры анимации с виртуальным временем не идут.

  Запуск:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --allow-file-access-from-files \
      --virtual-time-budget=40000 --dump-dom "file://$PWD/tests/reading-anim-test.html"
-->
<div id="log" style="font:13px/1.6 ui-monospace,monospace;white-space:pre;padding:16px"></div>
<script src="../shared.js"></script>
<script src="../templates.js"></script>
<script src="../helpers.js"></script>
<script src="../capture.js"></script>
<script src="../anim.js"></script>
<div id="gptpdf-host" class="gptpdf-block gptpdf-text-right"></div>
<script>
const out = [];
let failed = 0;
function check(name, cond, detail) {
    out.push((cond ? '✓ ' : '✗ ') + name + (detail !== undefined ? '   → ' + detail : ''));
    if(!cond) failed++;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function run(ms) {                    // scene time and page time together
    for(let t = 0; t < ms; t += 50) {
        gptpdfAnim._tick(50);
        await sleep(50);
    }
}
const st = () => gptpdfAnim._state();

(async function() {
    try {
        gptpdfAnim.fromText('Reading 3 of 10 messages…');
        check('без карточки — ни ошибки, ни сцены', !st().on);

        document.head.insertAdjacentHTML('beforeend', '<style>' + UI_CSS + '</style>');
        document.getElementById('gptpdf-host').innerHTML = EXPORT_BUTTON_HTML;
        gptpdfAnim._manual(true);
        showLoadingOverlay();

        out.push('— Наверх: подъём к началу чата —');
        setHarvestProgress('Loading older messages… 1 part');
        check('сцена началась, но сразу не видна (короткий чат не мелькает)', st().mode === 'loading' && !st().on);
        const c0 = st().crank;
        await run(1300);
        check('через 1,2 с — видна', st().on);
        check('в карточке нарисована', !!document.querySelector('#gptpdf-progress .gptpdf-anim svg'));
        check('крутит ручку', st().pose === 'up' && st().crank !== c0, st().pose + ', ручка ' + c0 + ' → ' + st().crank);
        setHarvestProgress('Loading older messages… 2 parts');
        check('наверху листы не летят', !st().flying && st().sheets === 0);

        out.push('', '— Вниз: чтение —');
        setHarvestProgress('Reading 1 of 10 messages…');
        await run(600);
        const c1 = st().crank, t1 = st().tape;
        setHarvestProgress('Reading 2 of 10 messages…');
        check('новое число — листок летит', st().flying);
        await run(900);
        check('читает: ручка стоит, лента шагнула сама', st().pose === 'down' && st().crank === c1 && st().tape === t1 + 16,
              st().pose + ', ручка ' + c1 + ' → ' + st().crank + ', лента ' + t1 + ' → ' + st().tape);
        check('листок долетел в стопку', !st().flying && st().sheets === 1, st().sheets);
        setHarvestProgress('Reading 3 of 10 messages…');
        await run(900);
        check('ещё одно — стопка растёт', st().sheets === 2, st().sheets);

        out.push('', '— Число стоит (картинки грузятся) —');
        await run(5000);
        check('5 с без нового — поза та же, без перескоков', st().pose === 'down' && !st().frozen, st().pose);

        out.push('', '— Вкладка скрыта —');
        setHarvestProgress('Paused: switch back to this tab to continue');
        const t2 = st().tape;
        await run(1500);
        check('«Paused» — сцена замирает на месте', st().on && st().frozen && st().tape === t2 && st().pose === 'down');
        setHarvestProgress('Reading 4 of 10 messages…');
        await run(800);
        check('число пошло — живёт дальше', !st().frozen && st().tape === t2 + 16, st().tape);
        setHarvestProgress('Filling in 5 messages…');
        setHarvestProgress('Filling in 4 messages…');
        check('дособор («осталось N», вниз) — тоже листок', st().flying);

        out.push('', '— После прокрутки: скрепляет стопку в книгу (1.2.7) —');
        hideLoadingOverlay();                       // the scrolling ends: the card blinks off
        check('прокрутка кончилась — сцена ушла вместе с карточкой', !st().on && st().mode === '');
        gptpdfExportStep('Preparing the PDF…');
        check('следующий шаг подхватывает сцену сразу, без задержки', st().on && st().mode === 'binding');
        gptpdfExportImages('Adding images', 1, 3);
        check('картинки — та же сцена', st().on && st().mode === 'binding');
        await run(2400);
        check('дошёл до стопки и скрепляет: обложка закрывается',
              st().pose === 'bind' && st().walk === 1 && st().cover > 0, 'шаг ' + st().walk + ', обложка ' + st().cover);
        check('в стопке есть что скреплять', st().sheets >= 5, st().sheets);
        gptpdfExportServer(40);
        check('сервер делает PDF — сцена остаётся', st().on && st().mode === 'binding');
        hideLoadingOverlay();
        check('файл пришёл, карточку убрали — сцены нет', !st().on && st().mode === '');
    } catch(e) {
        check('без исключений', false, e.message);
    }
    out.push('');
    out.push(failed === 0 ? '✅ все проверки пройдены' : '❌ провалено проверок: ' + failed);
    document.getElementById('log').textContent = out.join('\n');
})();
</script>

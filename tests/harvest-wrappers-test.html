<title>harvestVirtualizedTurns — классическая лента с обёртками (10-2026)</title>
<!--
  Проверяет сбор по обёрткам (capture.js, harvestByWrappers) на классической ленте
  ChatGPT в том виде, в каком она замерена 06.10 на чате автора «мудрец»
  (CHATGPT-DOM.md §10):
    • у КАЖДОГО турна диалога с самого начала есть обёртка
      `[data-turn-id-container][data-is-intersecting]`, содержимое монтируется,
      только пока обёртка на экране (IntersectionObserver на каждую);
    • несмонтированная обёртка — пустая коробка с УГАДАННОЙ высотой; турн, который
      страница не рисует (system, скрытый tool), — пустая коробка нулевой высоты;
    • последние 5 турнов и некоторые турны в середине смонтированы всегда;
    • нумерация `conversation-turn-N` с дырами (в «мудреце» №470 нет вовсе);
    • при смене высот страница держит в кадре первый видимый турн (сдвигает scrollTop).

  Сцены:
    A — контроль: та же лента БЕЗ признака обёрток → старый путь (подъём + спуск +
        добор по номерам). Фиксирует, что старый путь платит здесь лишним временем
        и врёт про пропуск по дыре в нумерации, — то, что лечит сбор по обёрткам.
    B — длинный чат открыт внизу: всё, что страница рисует, поймано; скрытые
        посчитаны; порядок точный; пересборка клона end-to-end; время ограничено.
    C — медленный монтаж (1.2 с на турн): ничего не потеряно.
    D — турн, который не монтируется никогда: сбор не виснет, отчёт его называет.
    E — средний чат длиннее двух экранов: сторож времени.
    F — страница со входом держит чат СТРАНИЦАМИ (код страницы, 06.10): открыты новейшие
        турны, над ними сторож `conversation-pagination-sentinel`; старое грузится по ВХОДУ
        сторожа в зону (80 px над верхом). Сбор догружает все страницы, потом идёт по списку.
    G — первая догрузка падает, у сторожа кнопка «Try again»: сбор жмёт её и идёт дальше.
    H — сторож не отвечает: сбор не виснет и пишет, что начало чата не загружено.
    I — догрузка зависла (спиннер навсегда): загруженное снято целиком, зависание названо.
    J — сбои догрузки то тут, то там, повтор каждый раз проходит: догрузка не обрывается.
    K — карточка молчит первые 10 с; через 10 с — «не уходите с вкладки»; факты догрузки с 30-й секунды, по очереди
        каждые 20 с; факт чтения — с 10-й секунды чтения (слово автора 07.10).
    M — график-вывод кода дорисовывается через 1 с после текста ответа: сбор ждёт его (замер 07.10, «мудрец»).
    N — живой график ChatGPT рисуется через 1,5 с после текста: сбор ждёт SVG, не «Загрузка» (08.10).
    L — ушёл с вкладки до 10-й секунды и вернулся: «экспорт ждал» не затирается предупреждением.

  Запуск (без установки чего-либо):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --allow-file-access-from-files \
      --virtual-time-budget=600000 --dump-dom \
      "file://$PWD/tests/harvest-wrappers-test.html"

  Границы: лента ЭМУЛИРОВАНА по замеру. Живую страницу проверяет прогон на ссылке
  шаринга «мудреца» во встроенном браузере (§10) и экспорт автора.
-->
<div id="log" style="font:13px/1.6 ui-monospace,monospace;white-space:pre;padding:16px"></div>
<!-- the card's lines, as in templates.js: the fact timing is checked in scene J -->
<div id="gptpdf-loading-overlay" style="display:none"></div>
<div id="gptpdf-progress" class="gptpdf-loading-card" style="display:none">
  <div class="gptpdf-loading-text"></div><div class="gptpdf-loading-fact"></div>
  <div class="gptpdf-loading-hint"></div></div>
<script src="../helpers.js"></script>
<script src="../capture.js"></script>
<script>
const VIEW_H = 400;
const ESTIMATE = 300;       // угаданная высота несмонтированного турна
const out = [];
let failed = 0;
function check(name, cond, detail) {
    if(!cond) failed++;
    out.push((cond ? '✓ ' : '✗ ') + name + (detail ? '   → ' + detail : ''));
}

// Настоящая высота турна: от строки до нескольких экранов, детерминированно.
const realH = (i) => 60 + ((i * 7919) % 13) * 110;

// ── сцена: лента, где у каждого турна есть обёртка ──────────────────────
function mountScene(opts) {
    const old = document.getElementById('scene');
    if(old) old.remove();
    const scroller = document.createElement('div');
    scroller.id = 'scene';
    scroller.style.cssText = 'height:' + VIEW_H + 'px;overflow-y:auto';
    const list = document.createElement('div');
    scroller.appendChild(list);
    document.body.appendChild(scroller);

    const total = opts.total;
    const isHidden = (i) => opts.hiddenEvery && i % opts.hiddenEvery === 0;
    const always = new Set(opts.always || []);
    for(let i = Math.max(0, total - 5); i < total; i++) always.add(i);
    const never = new Set(opts.never || []);
    // Номер в data-testid: только у рисуемых турнов, и с дырой после gapAfter.
    const num = {};
    let n = 1;
    for(let i = 0; i < total; i++) {
        if(isHidden(i)) continue;
        num[i] = n++;
        if(i === opts.gapAfter) n++;
    }
    // Страница со входом держит длинный чат СТРАНИЦАМИ (opts.pages): при
    // открытии в ленте только новейшие atOpen турнов, над ними — сторож.
    const P = opts.pages;
    let oldest = P ? total - P.atOpen : 0;
    const wrappers = [];
    for(let i = 0; i < total; i++) {
        const w = document.createElement('div');
        w.setAttribute('data-turn-id-container', 't' + i);
        w.setAttribute('data-is-intersecting', 'false');
        if(!isHidden(i)) {
            w.className = 'ph';
            w.style.height = ESTIMATE + 'px';
            w.style.minHeight = '56px';
        }
        if(i >= oldest) list.appendChild(w);
        wrappers.push(w);
    }
    if(opts.noWrappers) {
        // Контроль A: та же лента, но без признака обёрток — старый путь.
        wrappers.forEach(w => w.removeAttribute('data-is-intersecting'));
    }
    // Сторож как в коде страницы: data-testid, h-10; спиннер, пока грузится;
    // кнопка «Try again» после сбоя; нет его — старых страниц не осталось.
    // Загрузка — по ВХОДУ в зону наблюдателя (80 px над верхом), как у
    // IntersectionObserver: стоять в зоне бесполезно.
    let sentinel = null, loading = false, fetches = 0, failedOnce = false, wasIn = false;
    if(P && oldest > 0) {
        sentinel = document.createElement('div');
        sentinel.setAttribute('data-testid', 'conversation-pagination-sentinel');
        sentinel.style.height = '40px';
        list.insertBefore(sentinel, list.firstChild);
    }
    // Номер страницы, которую грузим: сбои по номерам (P.failOn) — первая
    // попытка этой страницы падает, повтор проходит. P.hang — спиннер навсегда.
    const failedPages = new Set();
    let pageNo = 0;
    function fetchOlder() {
        loading = true; fetches++;
        sentinel.innerHTML = '<svg class="spinner" width="20" height="20"></svg>';
        if(P.hang) return;
        setTimeout(function() {
            const failNow = (P.failFirst && !failedOnce) ||
                ((P.failOn || []).includes(pageNo + 1) && !failedPages.has(pageNo + 1));
            if(failNow) {
                failedOnce = true; failedPages.add(pageNo + 1); loading = false;
                sentinel.innerHTML = '<button type="button">Try again</button>';
                sentinel.querySelector('button').onclick = fetchOlder;
                return;
            }
            pageNo++;
            const from = Math.max(0, oldest - P.size);
            const before = scroller.scrollHeight;
            const first = wrappers[oldest];
            for(let i = from; i < oldest; i++) list.insertBefore(wrappers[i], first);
            oldest = from;
            scroller.scrollTop += scroller.scrollHeight - before;   // вид на месте
            loading = false;
            if(oldest === 0) { sentinel.remove(); sentinel = null; }
            else sentinel.innerHTML = '';
        }, P.delay || 300);
    }
    const mounted = new Set();
    const pending = new Map();      // i → время, когда «React» дорисует
    let mounts = 0;
    function body(i) {
        return '<article data-testid="conversation-turn-' + num[i] + '">' +
               '<div data-message-id="m' + i + '" style="height:' + realH(i) + 'px">' +
               '<p>msg ' + i + '</p><p data-turn-id-container="t' + i + '">inner</p>' +
               (opts.deadLinkEvery && i % opts.deadLinkEvery === 1 ?
                   '<a class="decorated-link">source</a>' : '') +
               '</div></article>';
    }
    // Как ChatGPT: держать в кадре первый видимый турн, когда высоты меняются.
    function anchored(change) {
        const top = scroller.getBoundingClientRect().top;
        let anchor = null, off = 0;
        for(const w of wrappers) {
            if(!w.isConnected) continue;
            const r = w.getBoundingClientRect();
            if(r.bottom > top && r.height > 0) { anchor = w; off = r.top - top; break; }
        }
        change();
        if(anchor) {
            const d = anchor.getBoundingClientRect().top - top - off;
            if(Math.abs(d) > 1) scroller.scrollTop += d;
        }
    }
    function mount(i) {
        const w = wrappers[i];
        w.style.height = '';
        w.innerHTML = body(i);
        // Живой график ChatGPT: сперва «Загрузка» (role=status), SVG — позже.
        if(opts.graphEvery && i % opts.graphEvery === 0) {
            const turn = w.firstElementChild || w;
            turn.insertAdjacentHTML('beforeend', '<div data-testid="math-block-layout">' +
                '<div role="status"><svg></svg><span>Загрузка</span></div></div>');
            const block = turn.lastElementChild;
            setTimeout(function() {
                if(block.isConnected) block.innerHTML = '<div class="graphable-function-v2-jsxgraph">' +
                    '<svg width="313" height="239"></svg></div>';
            }, opts.graphDelay || 1500);
        }
        // Картинка-вывод кода (график): место пустое с текстом, <img> — позже.
        if(opts.chartEvery && i % opts.chartEvery === 0) {
            const turn = w.firstElementChild || w;
            turn.insertAdjacentHTML('beforeend',
                '<div class="flex flex-wrap gap-2"><div class="max-h-64"></div></div>');
            const slot = turn.lastElementChild.firstElementChild;
            setTimeout(function() {
                if(slot.isConnected) slot.innerHTML = '<img alt="chart" src="data:image/png;base64,iVBORw0KGgo=">';
            }, opts.chartDelay || 1000);
        }
        if(!opts.noWrappers) w.setAttribute('data-is-intersecting', 'true');
        mounted.add(i);
        mounts++;
    }
    function unmount(i) {
        const w = wrappers[i];
        const h = w.getBoundingClientRect().height;
        w.innerHTML = '';
        w.style.height = h + 'px';
        if(!opts.noWrappers) w.setAttribute('data-is-intersecting', 'false');
        mounted.delete(i);
    }
    // «IntersectionObserver»: опрос таймером — в headless события прокрутки
    // почти не доезжают (CHATGPT-DOM.md §8), а таймеры идут исправно.
    const tick = setInterval(function() {
        if(!scroller.isConnected) { clearInterval(tick); return; }
        const r0 = scroller.getBoundingClientRect();
        const now = Date.now();
        if(sentinel && !P.deaf) {
            const r = sentinel.getBoundingClientRect();
            const isIn = r.bottom > r0.top - 80 && r.top < r0.bottom;
            if(isIn && !wasIn && !loading && !sentinel.querySelector('button')) fetchOlder();
            wasIn = isIn;
        }
        const toMount = [], toUnmount = [];
        for(let i = oldest; i < total; i++) {
            if(isHidden(i) || never.has(i)) continue;
            const r = wrappers[i].getBoundingClientRect();
            const inView = r.bottom > r0.top && r.top < r0.bottom;
            if(inView && !mounted.has(i)) {
                if(!pending.has(i)) pending.set(i, now + (opts.mountDelay || 120));
                else if(pending.get(i) <= now) { toMount.push(i); pending.delete(i); }
            } else if(!inView) {
                pending.delete(i);
                if(mounted.has(i) && !always.has(i)) toUnmount.push(i);
            }
        }
        if(toMount.length || toUnmount.length) {
            anchored(function() { toMount.forEach(mount); toUnmount.forEach(unmount); });
        }
    }, 50);
    always.forEach(i => { if(!isHidden(i) && !never.has(i)) mount(i); });
    scroller.scrollTop = scroller.scrollHeight;     // чат открывается внизу
    const expected = [];
    for(let i = 0; i < total; i++) {
        if(!isHidden(i) && !never.has(i)) expected.push('msg:m' + i);
    }
    const hiddenCount = Array.from({ length: total }, (_, i) => i).filter(isHidden).length;
    const expectedFrom = (from) => expected.filter(k => +k.slice(5) >= from);
    return { scroller, list, expected, expectedFrom, hiddenCount,
             stats: () => ({ mounts, fetches, failedOnce, oldest, sentinel: !!sentinel }) };
}

(async function run() {
    // ── A. Контроль: без признака обёрток идёт старый путь ───────────────
    let scene = mountScene({ total: 80, hiddenEvery: 9, gapAfter: 30, always: [20, 47], noWrappers: true });
    const a = await harvestVirtualizedTurns();
    const ai = a.gptpdfHarvest || {};
    out.push('— A. Контроль: та же лента без признака обёрток → старый путь —');
    out.push('  поймано ' + a.size + ' из ' + scene.expected.length + ', ушло секунд: ' +
             ai.seconds + ', «пропущено» по нумерации: ' + ai.missing);
    check('старый путь врёт про пропуск по дыре в нумерации (то, что лечим)',
          ai.mode === undefined && ai.missing > 0, 'missing=' + ai.missing);

    // ── B. Длинный чат, открыт внизу ────────────────────────────────────
    scene = mountScene({ total: 80, hiddenEvery: 9, gapAfter: 30, always: [20, 47] });
    const b = await harvestVirtualizedTurns();
    const bi = b.gptpdfHarvest || {};
    out.push('');
    out.push('— B. 80 турнов (каждый 9-й скрыт), высоты угаданы неверно, открыт внизу —');
    out.push('  поймано ' + b.size + ' из ' + scene.expected.length + ', скрытых ' + bi.hidden +
             ', шагов ' + bi.steps + ', ушло секунд: ' + bi.seconds);
    check('шёл сбор по обёрткам', bi.mode === 'wrappers', 'mode=' + bi.mode);
    check('пойман весь диалог', b.size === scene.expected.length, 'поймано ' + b.size);
    check('скрытые турны посчитаны, а не ждались', bi.hidden === scene.hiddenCount,
          'hidden=' + bi.hidden + ' из ' + scene.hiddenCount);
    check('дыра в нумерации не считается пропуском', bi.missing === 0 && bi.failed === 0,
          'missing=' + bi.missing + ', failed=' + bi.failed);
    check('порядок совпал с диалогом',
          JSON.stringify(b.gptpdfOrder) === JSON.stringify(scene.expected),
          'первые: ' + (b.gptpdfOrder || []).slice(0, 3).join(','));
    const clone = scene.list.cloneNode(true);
    restoreVirtualizedTurns(clone, b);
    const built = [...clone.querySelectorAll('[data-message-id]')]
        .map(x => 'msg:' + x.getAttribute('data-message-id'));
    check('пересобранный клон идёт от первого турна до последнего',
          JSON.stringify(built) === JSON.stringify(scene.expected),
          built.length + ' турнов, начало: ' + built.slice(0, 3).join(','));
    check('быстрее старого пути на той же ленте', bi.seconds < ai.seconds,
          bi.seconds + ' с против ' + ai.seconds + ' с');
    check('вернул ленту туда, где её оставил человек',
          Math.abs(scene.scroller.scrollTop -
                   (scene.scroller.scrollHeight - scene.scroller.clientHeight)) < 60,
          'scrollTop=' + scene.scroller.scrollTop);

    // ── C. Медленный монтаж ─────────────────────────────────────────────
    scene = mountScene({ total: 30, hiddenEvery: 7, mountDelay: 1200 });
    const c = await harvestVirtualizedTurns();
    const ci = c.gptpdfHarvest || {};
    out.push('');
    out.push('— C. Турн монтируется 1.2 с —');
    out.push('  поймано ' + c.size + ' из ' + scene.expected.length + ', ушло секунд: ' + ci.seconds);
    check('медленная страница ничего не теряет', c.size === scene.expected.length && ci.failed === 0,
          'поймано ' + c.size + ', failed=' + ci.failed);
    check('порядок целый', JSON.stringify(c.gptpdfOrder) === JSON.stringify(scene.expected));

    // ── D. Турн, который не монтируется никогда ─────────────────────────
    scene = mountScene({ total: 30, hiddenEvery: 7, never: [12] });
    const d = await harvestVirtualizedTurns();
    const di = d.gptpdfHarvest || {};
    out.push('');
    out.push('— D. Турн №12 не монтируется никогда —');
    out.push('  поймано ' + d.size + ', failed ' + di.failed + ', ушло секунд: ' + di.seconds);
    check('сбор не виснет и называет потерю', di.failed === 1 && di.missing === 1,
          'failed=' + di.failed + ', missing=' + di.missing);
    check('остальные пойманы и стоят по порядку',
          JSON.stringify(d.gptpdfOrder) === JSON.stringify(scene.expected),
          d.size + ' турнов');
    check('на сломанном турне — не дольше двух ожиданий', di.seconds <= 12,
          'ушло ' + di.seconds + ' с');

    // ── E. Средний чат: сторож времени ──────────────────────────────────
    scene = mountScene({ total: 12 });
    const e = await harvestVirtualizedTurns();
    const ei = e.gptpdfHarvest || {};
    out.push('');
    out.push('— E. 12 турнов, лента длиннее двух экранов —');
    out.push('  поймано ' + e.size + ' из 12, шагов ' + ei.steps + ', ушло секунд: ' + ei.seconds);
    check('пойман весь чат', e.size === 12 && JSON.stringify(e.gptpdfOrder) === JSON.stringify(scene.expected));
    check('не ждёт у верха и не ходит по чату дважды', ei.seconds <= 4, 'ушло ' + ei.seconds + ' с');

    // ── F. Страница со входом: чат приходит страницами ──────────────────
    scene = mountScene({ total: 80, hiddenEvery: 9, pages: { atOpen: 25, size: 20, delay: 400 } });
    const f = await harvestVirtualizedTurns();
    const fi = f.gptpdfHarvest || {};
    const fs = scene.stats();
    out.push('');
    out.push('— F. Открыты последние 25 из 80, старое — страницами по 20 через сторожа —');
    out.push('  поймано ' + f.size + ' из ' + scene.expected.length + ', страниц догружено ' + fi.pages +
             ' (запросов ' + fs.fetches + '), ушло секунд: ' + fi.seconds);
    check('догружены все старые страницы, сторожа больше нет', fi.pages === 3 && !fi.pagesStalled && !fs.sentinel,
          'pages=' + fi.pages + ', stalled=' + fi.pagesStalled + ', сторож ' + (fs.sentinel ? 'есть' : 'снят'));
    check('пойман весь диалог с первого турна', f.size === scene.expected.length && fi.missing === 0,
          'поймано ' + f.size + ', missing=' + fi.missing);
    check('порядок совпал с диалогом',
          JSON.stringify(f.gptpdfOrder) === JSON.stringify(scene.expected),
          'первые: ' + (f.gptpdfOrder || []).slice(0, 3).join(','));

    // ── G. Первая догрузка падает: кнопка «Try again» ─────────────────────
    scene = mountScene({ total: 60, hiddenEvery: 9, pages: { atOpen: 20, size: 20, delay: 300, failFirst: true } });
    const g = await harvestVirtualizedTurns();
    const gi = g.gptpdfHarvest || {};
    out.push('');
    out.push('— G. Первая догрузка падает, сторож показывает «Try again» —');
    out.push('  поймано ' + g.size + ' из ' + scene.expected.length + ', страниц ' + gi.pages + ', ушло секунд: ' + gi.seconds);
    check('кнопка нажата, догрузка пошла дальше, диалог целиком',
          g.size === scene.expected.length && !gi.pagesStalled && scene.stats().failedOnce,
          'поймано ' + g.size + ', stalled=' + gi.pagesStalled);
    check('порядок целый', JSON.stringify(g.gptpdfOrder) === JSON.stringify(scene.expected));

    // ── H. Сторож не отвечает никогда ────────────────────────────────────
    scene = mountScene({ total: 60, hiddenEvery: 9, pages: { atOpen: 20, size: 20, deaf: true } });
    const h = await harvestVirtualizedTurns();
    const hi = h.gptpdfHarvest || {};
    out.push('');
    out.push('— H. Сторож есть, но старое не грузится —');
    out.push('  поймано ' + h.size + ', pagesStalled=' + hi.pagesStalled + ', ушло секунд: ' + hi.seconds);
    check('сбор не виснет и честно говорит, что начало не загружено', hi.pagesStalled === true && hi.seconds <= 20,
          'stalled=' + hi.pagesStalled + ', ' + hi.seconds + ' с');
    check('то, что есть, поймано и по порядку',
          JSON.stringify(h.gptpdfOrder) === JSON.stringify(scene.expectedFrom(40)),
          h.size + ' турнов');

    // ── I. Догрузка зависла: спиннер навсегда ───────────────────────────
    // Ревью 06.10: зависшая догрузка тратила общий бюджет простоя, и проход по
    // уже загруженному останавливался до первого шага — в PDF шли только
    // турны на экране, а отчёт писал «ничего не пропущено».
    scene = mountScene({ total: 60, hiddenEvery: 9, pages: { atOpen: 30, size: 20, hang: true } });
    const ii = await harvestVirtualizedTurns();
    const iii = ii.gptpdfHarvest || {};
    out.push('');
    out.push('— I. Старая страница грузится вечно (спиннер не уходит) —');
    out.push('  поймано ' + ii.size + ', pagesStalled=' + iii.pagesStalled + ', ушло секунд: ' + iii.seconds);
    check('загруженная часть снята целиком, несмотря на зависшую догрузку',
          JSON.stringify(ii.gptpdfOrder) === JSON.stringify(scene.expectedFrom(30)) && iii.missing === 0,
          ii.size + ' турнов, missing=' + iii.missing);
    check('зависание названо, и сбор не висит дольше своего срока', iii.pagesStalled === true && iii.seconds <= 70,
          'stalled=' + iii.pagesStalled + ', ' + iii.seconds + ' с');

    // ── J. Сбои то тут, то там: каждый повтор проходит ───────────────────
    // Ревью 06.10: счётчик повторов был общим на весь чат — четвёртый сбой
    // где угодно обрывал догрузку, даже когда все повторы удавались.
    scene = mountScene({ total: 200, hiddenEvery: 9, pages: { atOpen: 20, size: 20, delay: 120, failOn: [1, 3, 5, 7, 9] } });
    const j = await harvestVirtualizedTurns();
    const ji = j.gptpdfHarvest || {};
    out.push('');
    out.push('— J. 200 турнов, сбои на 1-й, 3-й, 5-й, 7-й и 9-й догрузке, повтор каждый раз проходит —');
    out.push('  поймано ' + j.size + ' из ' + scene.expected.length + ', страниц ' + ji.pages + ', ушло секунд: ' + ji.seconds);
    check('пять разрозненных сбоев не обрывают догрузку', !ji.pagesStalled && j.size === scene.expected.length,
          'stalled=' + ji.pagesStalled + ', поймано ' + j.size);
    check('порядок целый', JSON.stringify(j.gptpdfOrder) === JSON.stringify(scene.expected));

    // ── M. График дорисовывается через секунду после текста ───────────────
    // Замер 07.10 на «мудреце»: текст ответа — 0,4 с, место под график пустое,
    // сам <img> — ещё через секунду. Снимок без ожидания терял оба графика.
    // Плюс мёртвые ссылки (так на «мудреце»): с третьей такой сбор ждёт турн
    // лишь 400 мс — график не должен попасть под это сокращение.
    scene = mountScene({ total: 60, hiddenEvery: 9, chartEvery: 5, chartDelay: 1000, deadLinkEvery: 4 });
    const m = await harvestVirtualizedTurns();
    const charts = [...m.values()].filter(c => c.html && c.html.includes('max-h-64'));
    const withImg = charts.filter(c => /<img[^>]*alt="chart"/.test(c.html));
    out.push('');
    out.push('— M. 60 турнов, в каждом пятом график приходит через 1 с после текста, мёртвые ссылки в каждом четвёртом —');
    out.push('  турнов с местом под график: ' + charts.length + ', из них с самим графиком: ' + withImg.length +
             ' · ушло секунд: ' + (m.gptpdfHarvest || {}).seconds);
    check('каждый график попал в снимок', charts.length > 0 && withImg.length === charts.length,
          withImg.length + ' из ' + charts.length);
    check('лента снята целиком', m.size === scene.expected.length, 'поймано ' + m.size);

    // ── N. Живой график грузится полторы секунды после текста ────────────
    // Тестовый чат автора 08.10: выгрузка до конца загрузки дала в PDF
    // крутилку на всю страницу. Сбор ждёт SVG, как ждёт картинку.
    scene = mountScene({ total: 40, hiddenEvery: 9, graphEvery: 6, graphDelay: 1500, deadLinkEvery: 4 });
    const gn = await harvestVirtualizedTurns();
    const graphs = [...gn.values()].filter(c => c.html && c.html.includes('math-block-layout'));
    const drawn = graphs.filter(c => c.html.includes('jsxgraph') && !c.html.includes('role="status"'));
    out.push('');
    out.push('— N. 40 турнов, в каждом шестом живой график рисуется через 1,5 с —');
    out.push('  графиков: ' + graphs.length + ', снято нарисованными: ' + drawn.length);
    check('каждый график снят нарисованным, не «Загрузка»', graphs.length > 0 && drawn.length === graphs.length,
          drawn.length + ' из ' + graphs.length);

    // ── K. Что и когда говорит карточка ──────────────────────────────────
    // Слово автора 07.10: первым, через 10 с, — что делать (не уходить с
    // вкладки); факты догрузки — с 30-й секунды и сменяют друг друга каждые
    // 20 с; факт чтения — с 10-й секунды чтения.
    scene = mountScene({ total: 540, hiddenEvery: 9, mountDelay: 400,
                         pages: { atOpen: 20, size: 20, delay: 3000 } });
    const factEl = document.querySelector('.gptpdf-loading-fact');
    const hintEl = document.querySelector('.gptpdf-loading-hint');
    const textEl = document.querySelector('.gptpdf-loading-text');
    const t0 = Date.now();
    const sec = () => (Date.now() - t0) / 1000;
    const facts = [];           // каждая смена факта: [секунда, текст]
    let readFrom = null;        // секунда, когда пошло «Reading …»
    const mo = new MutationObserver(() => {
        if(readFrom === null && /^Reading/.test(textEl.textContent)) readFrom = sec();
        const last = facts.length ? facts[facts.length - 1][1] : '';
        if(factEl.textContent !== last) facts.push([sec(), factEl.textContent]);
    });
    mo.observe(document.getElementById('gptpdf-progress'),
               { subtree: true, childList: true, characterData: true });
    const at = {};
    [5, 12].forEach(s => setTimeout(() => {
        at[s] = { fact: factEl.textContent, hint: hintEl.textContent };
    }, s * 1000));
    const k = await harvestVirtualizedTurns();
    mo.disconnect();
    const short = (t) => t ? t.slice(0, 28) + '…' : '—';
    out.push('');
    out.push('— K. Догрузка 26 частей по 3 с, потом чтение: подсказка и факты —');
    out.push('  5 с: «' + (at[5] || {}).hint + '» · 12 с: «' + short((at[12] || {}).hint) + '»');
    out.push('  смены факта: ' + facts.map(f => Math.round(f[0]) + ' с ' + short(f[1])).join(' → '));
    out.push('  чтение с ' + Math.round(readFrom) + ' с · догрузка ' +
             Math.round(((k.gptpdfHarvest || {}).ms || {}).pages / 1000) + ' с');
    const loading = facts.filter(f => f[0] < readFrom);
    const reading = facts.filter(f => f[0] >= readFrom);
    const near = (f, s, text) => f && Math.abs(f[0] - s) <= 1.5 && f[1].startsWith(text);
    check('первые 10 с карточка молчит', at[5] && at[5].hint === '' && at[5].fact === '');
    check('через 10 с — не уходить с вкладки, факта ещё нет',
          at[12] && /Don't switch tabs/.test(at[12].hint) && at[12].fact === '');
    check('догрузка: о частях на 30-й, о запросах на 50-й, снова о частях на 70-й',
          near(loading[0], 30, 'ChatGPT sends') && near(loading[1], 50, 'Each part') &&
          near(loading[2], 70, 'ChatGPT sends'),
          loading.map(f => Math.round(f[0])).join(', '));
    check('чтение: факт догрузки снят, факт чтения — на 10-й секунде чтения',
          reading.length >= 2 && reading[0][1] === '' && reading[0][0] - readFrom < 1.5 &&
          near(reading[1], readFrom + 10, 'ChatGPT draws'),
          reading.map(f => Math.round(f[0] - readFrom) + ' с').join(', '));
    check('и вся лента при этом снята', k.size === scene.expected.length, 'поймано ' + k.size);

    // ── L. Ушёл с вкладки до 10 с и вернулся ────────────────────────────
    // Вернувшемуся нужно объяснение, что было, а не запоздалое
    // предупреждение: «не уходите» не затирает «экспорт ждал».
    scene = mountScene({ total: 160, hiddenEvery: 9, pages: { atOpen: 20, size: 20, delay: 3000 } });
    let tabHidden = false;
    Object.defineProperty(document, 'hidden', { configurable: true, get: () => tabHidden });
    setTimeout(() => { tabHidden = true; }, 3000);
    setTimeout(() => { tabHidden = false; }, 6000);
    const atL = {};
    [8, 14].forEach(s => setTimeout(() => { atL[s] = hintEl.textContent; }, s * 1000));
    const l = await harvestVirtualizedTurns();
    delete document.hidden;
    out.push('');
    out.push('— L. Вкладка скрыта с 3-й по 6-ю секунду —');
    out.push('  8 с: «' + (atL[8] || '') + '» · 14 с: «' + (atL[14] || '') + '»');
    check('после возвращения — почему ждали', /waited while this tab was hidden/.test(atL[8] || ''));
    check('и на 10-й секунде это не затёрто', /waited while this tab was hidden/.test(atL[14] || ''));
    check('лента снята целиком', l.size === scene.expected.length, 'поймано ' + l.size);

    out.push('');
    out.push(failed === 0 ? '✅ все проверки пройдены' : '❌ провалено проверок: ' + failed);
    document.getElementById('log').textContent = out.join('\n');
})();
</script>

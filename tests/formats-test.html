<script>
const log = document.getElementById('log');
let fails = 0;
function check(name, cond, detail) {
    if(!cond) fails++;
    log.textContent += (cond ? '✓ ' : '✗ ') + name + (cond ? '' : '   ' + (detail || '')) + '\n';
}
function copyOf(id) {
    return document.getElementById(id).content.firstElementChild.cloneNode(true);
}
const O = Object.assign({}, gptpdfShared.defaultOptions, { datetime_format: 'none', toc: 'basic' });
// Two TeX strings are the same formula when KaTeX draws them the same (its note of the source aside).
function sameMath(a, b) {
    const ml = function(s) { return katex.renderToString(s, { output: 'mathml' }).replace(/<annotation[\s\S]*?<\/annotation>/, ''); };
    try { return ml(a) === ml(b); } catch(e) { return false; }
}

(async function() {
    // ── classic page → Markdown ──
    const m1 = gptpdfFmtRead(copyOf('classic'), O);
    const md = gptpdfToMarkdown(m1, O, 'Lisbon trip');
    check('title', md.startsWith('# Lisbon trip\n'), md.slice(0, 40));
    check('question with its label, typed lines kept and not read as a list',
        md.includes('**You:**') && md.includes('\\- one') && md.includes('1\\. first'), md.slice(0, 300));
    check('the file a question carried', md.includes('*File: notes.csv*'));
    check('answer label', md.includes('**ChatGPT:**'));
    check('heading without the bold inside', md.includes('### Your 3-day plan'), (md.match(/^###.*$/m) || [''])[0]);
    check('bold, italic, code, link', md.includes('A **relaxed** pace, *one* sight, `split_budget()` and [a link](https://example.com/a).'));
    check('nested list', /- Alfama\n  - castle/.test(md), (md.match(/- Alfama[\s\S]{0,30}/) || [''])[0]);
    check('task item', md.includes('- [x] book tickets'));
    check('ordered list keeps its start', md.includes('3. third\n4. fourth'));
    check('table: header, right-aligned column, a | inside a cell',
        md.includes('| Day | Cost |\n| --- | ---: |\n| 1 \\| a | 90 |'), (md.match(/\| Day[\s\S]{0,60}/) || [''])[0]);
    check('code with its language', md.includes('```python\ndef f(x):\n    return x * 2\n```'));
    check('quote and rule', md.includes('> quoted') && md.includes('\n---\n'));
    check('formulas from their TeX', md.includes('$a^2+b^2=c^2$') && md.includes('$$\n\\frac{1}{2}\n$$'));
    check('screen-reader labels stay out', !md.includes('ChatGPT said'));

    // ── questions hidden, questions as headings ──
    const hidden = gptpdfToMarkdown(gptpdfFmtRead(copyOf('classic'), Object.assign({}, O, { no_questions: true })),
        Object.assign({}, O, { no_questions: true }), 'T');
    check('Hidden: no questions, no labels', !hidden.includes('Plan a trip') && !hidden.includes('**You:**') && !hidden.includes('**ChatGPT:**'));
    const H = Object.assign({}, O, gptpdfShared.LOOK_STYLES.doc);
    const asHead = gptpdfToMarkdown(gptpdfFmtRead(copyOf('classic'), H), H, 'T');
    check('Heading: the question is a ## heading, the answer one level down',
        asHead.includes('## Plan a trip.') && asHead.includes('#### Your 3-day plan'), asHead.slice(0, 200));

    // ── the new page: components, source pills, code block, formula drawn by KaTeX only ──
    const fresh = copyOf('fresh');
    fresh.querySelector('#kx').outerHTML = katex.renderToString('\\frac{a}{b}+x^{2}', { output: 'html' });
    const md2 = gptpdfToMarkdown(gptpdfFmtRead(fresh, O), O, 'Keys');
    check('new page: title heading', md2.includes('## 1. Clusters'));
    check('new page: paragraph with bold and code', md2.includes('Read **1 603 rows**, columns `kd`.'));
    check('source pill: one link with the source name, no +1',
        md2.includes('[Federal Tax Service](https://www.nalog.gov.ru/x)') && !md2.includes('+1'), (md2.match(/Read[^\n]*/) || [''])[0]);
    check('favicon badge stays out', !md2.includes('site +1'));
    check('new page: table from tbody with th, right column',
        md2.includes('| Cluster | Volume |\n| --- | ---: |\n| Guides | 43 550 |'), (md2.match(/\| Cluster[\s\S]{0,80}/) || [''])[0]);
    check('new page: code block without the toolbar word', md2.includes('```\na\n+ b\n```') && !md2.includes('Код'));
    const back = (md2.match(/Formula \$([^$]+)\$ end\./) || [])[1] || '';
    check('TeX read back from KaTeX\'s drawing', !!back && sameMath(back, '\\frac{a}{b}+x^{2}'), (md2.match(/Formula[^\n]*/) || [''])[0]);

    // ── TeX read back: more shapes, each drawn by KaTeX and read again ──
    [['x_{i}^{2}', 'x_{i}^{2}'], ['\\sqrt{x+1}', '\\sqrt{x+1}'], ['\\sqrt[3]{8}', '\\sqrt[3]{8}'], ['\\alpha \\le \\beta', '\\alpha \\le \\beta'],
     ['\\frac{x^{2}}{2}', '\\frac{x^{2}}{2}'], ['\\text{if } x', '\\text{if } x']].forEach(function(c) {
        const box = document.createElement('div');
        box.innerHTML = katex.renderToString(c[0], { output: 'html' });
        const back = gptpdfKatexToTex(box.querySelector('.katex-html'));
        check('KaTeX → TeX: ' + c[0], sameMath(back, c[1]), 'got ' + back);
    });

    // ── Word ──
    const W = Object.assign({}, O, { page_numbers: true, page_break: 'after', source_link: false });
    const bytes = await gptpdfToDocx(gptpdfFmtRead(copyOf('classic'), W), W, 'Lisbon trip');
    check('docx is a zip', bytes[0] === 0x50 && bytes[1] === 0x4b && bytes[2] === 3 && bytes[3] === 4);
    const files = await unzip(bytes);
    ['[Content_Types].xml', '_rels/.rels', 'word/document.xml', 'word/styles.xml', 'word/numbering.xml',
     'word/settings.xml', 'word/_rels/document.xml.rels', 'word/footer1.xml', 'docProps/core.xml'].forEach(function(n) {
        check('part ' + n, !!files[n]);
    });
    let allXml = true, bad = '';
    Object.keys(files).forEach(function(n) {
        if(!/\.(xml|rels)$/.test(n)) return;
        const doc = new DOMParser().parseFromString(files[n], 'application/xml');
        if(doc.getElementsByTagName('parsererror').length) { allXml = false; bad = n; }
    });
    check('every part is well-formed XML', allXml, bad);
    const d = files['word/document.xml'] || '';
    check('word: heading, list numbering, table, code style', /Heading3/.test(d) && /<w:numPr>/.test(d) && /<w:tbl>/.test(d) && /w:val="Code"/.test(d));
    check('word: formulas as Word math', /<m:oMath>/.test(d) && /<m:oMathPara>/.test(d) && /<m:f>/.test(d) && /<m:sSup>/.test(d));
    check('word: link with its address', /<w:hyperlink r:id="rId\d+"/.test(d) && (files['word/_rels/document.xml.rels'] || '').includes('https://example.com/a'));
    check('word: question as a bookmark target, page numbers, A4 margins',
        /w:name="gptpdf_q0"/.test(d) && /footerReference/.test(d) && /<w:pgSz w:w="11906" w:h="16838"\/>/.test(d));
    check('word: ordered list starts at 3', /<w:startOverride w:val="3"\/>/.test(files['word/numbering.xml'] || ''));

    // ── pictures and files (18.11, the author's «Художник_базовый» and «мудрец») ──
    const pngOf = function(w, h, alpha) {
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const g = c.getContext('2d');
        const im = g.createImageData(w, h);
        for(let i = 0; i < im.data.length; i += 4) {
            im.data[i] = Math.random() * 255; im.data[i + 1] = Math.random() * 255; im.data[i + 2] = (i / 4) % 255;
            im.data[i + 3] = alpha ? 128 : 255;
        }
        g.putImageData(im, 0, 0);
        return c.toDataURL('image/png');
    };
    const ref = pngOf(64, 64, false);
    const pics = function() {
        const c = copyOf('pics');
        c.querySelector('img.h-7').setAttribute('src', ref);
        return c;
    };
    const mp = gptpdfToMarkdown(gptpdfFmtRead(pics(), O), O, 'Pics');
    check('markdown: a picture ChatGPT made is named in its place', mp.includes('*[Generated image 1]*'), mp);
    check('markdown: an icon and an unmarked ChatGPT thumbnail stay out', !mp.includes('GPT icon') && (mp.match(/\*\[/g) || []).length === 1, mp);
    check('markdown: the picture being edited is not named again in the question (it is, a line above)', mp.includes('**You:** Make it darker') && !mp.includes('Исходное'), mp.slice(0, 120));
    check('a file an answer made: its name once, the card\'s words out',
        mp.includes('*File: Photon_Sprite.png*') && !mp.includes('Photon_Sprite.pngImage') && !mp.includes('Open file'), mp);
    check('a file named inside a sentence stays a word', mp.includes('The name notes.txt inside a sentence stays.') && !mp.includes('File: notes.txt'));
    check('an inline mention keeps its words', mp.includes('You can download it here.'));

    const pb = await gptpdfToDocx(gptpdfFmtRead(pics(), W), W, 'Pics');
    const pf = await unzip(pb);
    const pd = pf['word/document.xml'] || '';
    check('word: the picture being edited stays 28 px tall and faded, as in the chat',
        /<wp:extent cx="266700" cy="266700"\/>/.test(pd) && /<a:alphaModFix amt="50000"\/>/.test(pd), (pd.match(/<wp:extent[^>]*>/) || [''])[0]);
    check('word: the file card as one line', pd.includes('Photon_Sprite.png') && !pd.includes('Open file') && !/Photon_Sprite\.png<\/w:t><\/w:r><w:r><w:rPr>[^]*?Image</.test(pd));

    // A heavy picture goes lighter: opaque → JPEG, see-through stays PNG (Google Docs opens no .docx over 50 MB).
    const heavy = pngOf(700, 700, false), clear = pngOf(700, 700, true);
    const hb = await gptpdfToDocx({ turns: [{ role: 'assistant', blocks: [
        { t: 'img', src: heavy, alt: '', w: 700, h: 700 }, { t: 'img', src: clear, alt: '', w: 700, h: 700 }] }] }, W, 'Heavy');
    const hf = await unzip(hb);
    const media = Object.keys(hf).filter(function(n) { return n.startsWith('word/media/'); }).sort();
    const heavyBytes = atob(heavy.split(',')[1]).length;
    check('word: a heavy picture with nothing see-through goes in as JPEG, lighter',
        media[0] === 'word/media/image1.jpeg' && hf[media[0]].length < heavyBytes, media.join(', ') + ' · ' + (hf[media[0]] || []).length + ' < ' + heavyBytes);
    check('word: a see-through picture stays PNG', media[1] === 'word/media/image2.png', media.join(', '));
    check('word: JPEG is in the content types', /Extension="jpeg"/.test(hf['[Content_Types].xml'] || ''));

    log.textContent += fails ? '\nFAIL: ' + fails + '\n' : '\nall passed\n';
})().catch(function(e) { log.textContent += '✗ crashed: ' + e + '\n' + (e.stack || '') + '\n'; });

// A small unzip for the check: the central directory, then each part (stored or deflated).
async function unzip(b) {
    const v = new DataView(b.buffer, b.byteOffset, b.byteLength);
    let e = b.length - 22;
    while(e > 0 && v.getUint32(e, true) !== 0x06054b50) e--;
    const n = v.getUint16(e + 10, true);
    let p = v.getUint32(e + 16, true);
    const out = {};
    for(let i = 0; i < n; i++) {
        const method = v.getUint16(p + 10, true), csize = v.getUint32(p + 20, true);
        const nameLen = v.getUint16(p + 28, true), extra = v.getUint16(p + 30, true), comment = v.getUint16(p + 32, true);
        const off = v.getUint32(p + 42, true);
        const name = new TextDecoder().decode(b.subarray(p + 46, p + 46 + nameLen));
        const lNameLen = v.getUint16(off + 26, true), lExtra = v.getUint16(off + 28, true);
        const data = b.subarray(off + 30 + lNameLen + lExtra, off + 30 + lNameLen + lExtra + csize);
        let raw = data;
        if(method === 8) raw = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
        out[name] = /\.(xml|rels)$/.test(name) ? new TextDecoder().decode(raw) : raw;
        p += 46 + nameLen + extra + comment;
    }
    return out;
}
</script>

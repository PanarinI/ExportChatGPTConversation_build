<!doctype html>
<meta charset="utf-8">
<title>Баннер CWS 1280×800 — форматы (08.10.2026)</title>
<!--
  Третий скриншот страницы расширения в Chrome Web Store (слово автора 08.10: «слайд с набором деталей,
  чтобы было видно, с какими кейсами и форматами справляется»). Стиль — как у двух нынешних: красно-оранжевый
  градиент, крупный белый заголовок снизу слева. Каждая плитка — вырезка из НАСТОЯЩЕГО PDF, выгруженного
  расширением через наш сервер: таблица, код, формулы, картинка — демо-чат стенда
  (tests/blockmode-live-stand.html?demo=formats → tests/e2e-render.js; картинка — нейтральная акварель, сделана
  gpt-image-1, слово автора: «возьми что-то нейтральное»), график и источники — тестовый чат автора (шаринг
  6ac75a91…, светлая тема); «In ChatGPT» — снимок настоящей плашки «matplotlib.org +1» со страницы шаринга. Формулы — правда с 1.2.2 (MathML), баннер ставить вместе с ней.
  Снимок: headless Chrome --screenshot --window-size=1280,800.
-->
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body {
    position: relative;
    background: linear-gradient(135deg, #f45b35 0%, #e9442d 52%, #d6321f 100%);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  }
  .grid { position: absolute; left: 60px; right: 60px; top: 40px; height: 540px;
          display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 22px; }
  .tile { background: #fff; border-radius: 18px; box-shadow: 0 18px 44px rgba(70,10,0,.35), 0 3px 10px rgba(70,10,0,.2);
          display: flex; flex-direction: column; padding: 16px 20px 18px; box-sizing: border-box; overflow: hidden; }
  .label { font-size: 23px; font-weight: 800; color: #d6321f; letter-spacing: -0.2px; margin: 0 0 10px; }
  .show { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 0; }
  .show img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .tall img { max-height: 196px; }
  .src { gap: 4px; }
  .src .cap { font-size: 15px; font-weight: 700; color: #8a8a8a; text-transform: uppercase; letter-spacing: .6px; }
  .src .arrow { font-size: 22px; line-height: 1; color: #d6321f; font-weight: 800; margin: 2px 0; }
  h1 { position: absolute; left: 76px; bottom: 92px; margin: 0; color: #fff; font-size: 66px; font-weight: 800;
       letter-spacing: -1.4px; line-height: 1; }
  .sub { position: absolute; left: 78px; bottom: 44px; color: rgba(255,255,255,.92); font-size: 29px; font-weight: 600; }
</style>
<div class="grid">
  <div class="tile"><div class="label">Tables</div><div class="show"><img src="tile-table.png" alt=""></div></div>
  <div class="tile"><div class="label">Code</div><div class="show"><img src="tile-code.png" alt=""></div></div>
  <div class="tile"><div class="label">Formulas</div><div class="show">
    <img src="tile-formula-inline.png" alt="" style="max-width:88%">
    <img src="tile-formula-display.png" alt="" style="max-width:70%"></div></div>
  <div class="tile"><div class="label">Charts</div><div class="show tall"><img src="tile-chart.png" alt=""></div></div>
  <div class="tile"><div class="label">Images</div><div class="show tall"><img src="tile-image.png" alt=""></div></div>
  <div class="tile"><div class="label">Sources, each a link</div><div class="show src">
    <div class="cap">In ChatGPT</div>
    <img src="tile-pill-chat.png" alt="" style="height:44px">
    <div class="arrow">↓</div>
    <div class="cap">In the PDF</div>
    <img src="tile-sources.png" alt="" style="width:88%"></div></div>
</div>
<h1>Every format makes it to the PDF</h1>
<div class="sub">Long chats in full · Clickable contents</div>
